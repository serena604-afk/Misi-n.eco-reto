
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Eco-Reto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <header class="encabezado">
        <h1>🌿 Misión Eco-Reto</h1>
        <p>Pequeñas acciones, grandes cambios para nuestro planeta.</p>
    </header>

    <main class="contenedor">
        <section class="resumen">
            <article class="tarjeta">
                <h2 id="totalAcciones">0</h2>
                <p>Acciones registradas</p>
            </article>
            <article class="tarjeta">
                <h2 id="totalAgua">0</h2>
                <p>Acciones sobre el agua</p>
            </article>
            <article class="tarjeta">
                <h2 id="totalOtras">0</h2>
                <p>Otras acciones</p>
            </article>
        </section>

        <section class="panel">
            <h2>🌎 Registra tu eco-acción</h2>

            <form id="formularioAccion">
                <label for="titulo">Título de la acción *</label>
                <input id="titulo" name="titulo" maxlength="150" required>

                <label for="categoria">Categoría *</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecciona una categoría</option>
                    <option value="Reciclaje">Reciclaje</option>
                    <option value="Agua">Agua</option>
                    <option value="Energia">Energía</option>
                    <option value="Naturaleza">Naturaleza</option>
                    <option value="Reutilizacion">Reutilización</option>
                    <option value="Transporte">Transporte</option>
                </select>

                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="3"></textarea>

                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" name="fecha">

                <label for="propuesto">Propuesto por</label>
                <input id="propuesto" name="propuesto" maxlength="100">

                <label for="resultado">Resultado</label>
                <textarea id="resultado" name="resultado" rows="3"></textarea>

                <div class="botones">
                    <button id="btnGuardar" type="submit">Guardar acción</button>
                    <button id="btnCancelar" type="button" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2>📋 Mis eco-acciones</h2>
            <label for="busqueda">Buscar acción</label>
            <input id="busqueda" type="search" placeholder="Escribe para buscar...">
            <div id="contenedorAcciones">
                <p>Cargando acciones...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>💚 Misión Eco-Reto | Cuidemos nuestro planeta.</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
